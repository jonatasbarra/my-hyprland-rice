# ── Geral ─────────────────────────────────────────────
set -g default-terminal "xterm-kitty"
set -ga terminal-overrides ",xterm-kitty:Tc"
set -g mouse on
set -g base-index 1          # janelas começam em 1, não 0
set -g pane-base-index 1
set -g renumber-windows on   # renumera ao fechar janela
set -sg escape-time 0        # sem delay no Escape (essencial pro Neovim)
set -g history-limit 10000

# ── Prefix: Ctrl+Space ────────────────────────────────
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# ── Splits intuitivos ─────────────────────────────────
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# ── Navegar entre panes com vim keys ──────────────────
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# ── Reload config ─────────────────────────────────────
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded!"

# ── Tokyo Night colors ────────────────────────────────
set -g status-style "bg=#1a1b26,fg=#a9b1d6"
set -g status-left "#[bg=#7aa2f7,fg=#1a1b26,bold] #S #[bg=#1a1b26,fg=#7aa2f7]"
set -g status-right "#[fg=#565f89] %H:%M #[fg=#7aa2f7]%d/%m/%Y "
set -g status-left-length 20
set -g window-status-current-format "#[fg=#7aa2f7,bold] #I:#W "
set -g window-status-format "#[fg=#565f89] #I:#W "
set -g pane-border-style "fg=#1a1b26"
set -g pane-active-border-style "fg=#7aa2f7"
set -g message-style "bg=#1a1b26,fg=#7aa2f7"

# ── TPM — plugin manager ──────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'   # salva sessões
set -g @plugin 'tmux-plugins/tmux-continuum'   # auto-save/restore

set -g @continuum-restore 'on'
set -g @resurrect-capture-pane-contents 'on'

run '~/.local/share/tmux/plugins/tpm/tpm'
