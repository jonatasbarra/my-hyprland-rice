# ╔══════════════════════════════════════════╗
# ║        hyprland.conf — config mínima     ║
# ║        F3 bootstrap — Tokyo Night        ║
# ╚══════════════════════════════════════════╝

# --- Monitor ---
monitor=,preferred,auto,1

# --- Programas padrão ---
$terminal = kitty
# Iniciado via: uwsm start hyprland

# --- Autostart ---
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = waybar
exec-once = swaync
exec-once = hypridle
exec-once = awww-daemon
exec-once = awww img $HOME/wallpapers/tokyonight01.png --transition-type fade --transition-duration 1

# --- Input ---
input {
    kb_layout = us
    follow_mouse = 1
    touchpad {
        natural_scroll = true
    }
}

# --- Visual mínimo ---
general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2
    col.active_border = rgba(7aa2f7ff)
    col.inactive_border = rgba(414868ff)
    layout = dwindle
}

decoration {
    rounding = 8
}

# --- Keybinds essenciais ---
$mod = SUPER

bind = $mod, Return, exec, $terminal
bind = $mod, Q, killactive
bind = $mod SHIFT, E, exit
bind = $mod, F, fullscreen
bind = $mod, D, exec, rofi -show drun
bind = $mod, Tab, exec, rofi -show window
bind = $mod, N, exec, swaync-client -t
bind = $mod SHIFT, N, exec, swaync-client -d
bind = $mod, L, exec, hyprlock

# Screenshots
bind = , Print, exec, ~/.local/bin/screenshot region
bind = SHIFT, Print, exec, ~/.local/bin/screenshot full
bind = SUPER, Print, exec, ~/.local/bin/screenshot window

bind = $mod, H, movefocus, l
bind = $mod, L, movefocus, r
bind = $mod, K, movefocus, u
bind = $mod, J, movefocus, d

bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5

bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5

bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow
