# ╔══════════════════════════════════════════╗
# ║        hyprland.conf — config mínima     ║
# ║        F3 bootstrap — Tokyo Night        ║
# ╚══════════════════════════════════════════╝

# --- Monitor ---
monitor=,preferred,auto,1

# --- Programas padrão ---
$terminal = kitty
# Iniciado via: uwsm start hyprland

# --- Autostart ---
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = waybar
exec-once = swaync
exec-once = hypridle
exec-once = awww-daemon
exec-once = awww img $HOME/wallpapers/tokyonight01.png --transition-type fade --transition-duration 1
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
exec-once = /usr/bin/gnome-keyring-daemon --start --components=secrets
exec-once = eval $(/usr/bin/gnome-keyring-daemon --start --components=secrets)

# --- Input ---
input {
    #sensitivity = -0.5
    kb_layout = us
    kb_variant = intl
    follow_mouse = 1
    sensitivity = 0
    touchpad {
        natural_scroll = false
        disable_while_typing = true
        
        # Reduz a sensibilidade do scroll (o padrão é 1.0)
        # Ajuste este valor conforme necessário (ex: 0.5 torna o scroll mais lento)
        scroll_factor = 0.3
    }
    # logitech-g-pro--1 {
    #    sensitivity = -0.5
    # }
}

# --- Variáveis ---
env = QT_QPA_PLATFORMTHEME,qt6ct
env = QT_AUTO_SCREEN_SCALE_FACTOR,1

# --- Cursor ---
env = XCURSOR_THEME,Bibata-Modern-Ice
env = XCURSOR_SIZE,24
env = HYPRCURSOR_THEME,Bibata-Modern-Ice
env = HYPRCURSOR_SIZE,24

cursor {
    no_hardware_cursors = false
}

# --- Visual mínimo ---
general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2
    col.active_border = rgba(7aa2f7ff) rgba(bb9af7ff) 45deg  # azul → roxo Tokyo Night
    col.inactive_border = rgba(414868ff)
    layout = dwindle
}

decoration {
    rounding = 10

    blur {
        enabled = true
        size = 6
        passes = 3
        new_optimizations = true
        xray = false
        ignore_opacity = false
    }

    shadow {
        enabled = true
        range = 20
        render_power = 3
        color = rgba(1a1b26cc)        # fundo Tokyo Night com alpha
        color_inactive = rgba(1a1b2666)
    }
}

animations {
    enabled = true

    bezier = easeOut, 0.16, 1, 0.3, 1
    bezier = easeInOut, 0.85, 0, 0.15, 1
    bezier = overshot, 0.05, 0.9, 0.1, 1.05

    animation = windows, 1, 4, overshot, slide
    animation = windowsOut, 1, 3, easeOut, popin 80%
    animation = border, 1, 6, easeInOut
    animation = borderangle, 1, 12, easeInOut, loop   # gradiente animado na borda
    animation = fade, 1, 4, easeOut
    animation = workspaces, 1, 4, easeInOut, slide
}

# Gestures
gesture = 3, horizontal, workspace     # 3 dedos = navega workspaces
gesture = 3, up, fullscreen            # 3 dedos pra cima = fullscreen
gesture = 3, down, fullscreen          # 3 dedos pra baixo = sai fullscreen
gesture = 4, up, float                 # 4 dedos pra cima = toggle float
gesture = 4, horizontal, workspace     # 4 dedos horizontal = também navega workspaces

#dwindle {
#    pseudotile = true
#    preserve_split = true
#}

# --- Keybinds essenciais ---
$mod = SUPER

bindr = SUPER, Super_L, exec, rofi -show drun
bind = $mod, Return, exec, $terminal
bind = $mod, Q, killactive
bind = $mod SHIFT, E, exit
bind = $mod, F, fullscreen
bind = SUPER, E, exec, thunar
bind = SUPER, C, exec, google-chrome-stable
bind = $mod, Tab, exec, rofi -show window
bind = $mod, N, exec, swaync-client -t
bind = $mod SHIFT, N, exec, swaync-client -d
bind = $mod, L, exec, hyprlock
bind = SUPER, V, exec, cliphist list | rofi -dmenu -p "Clipboard" | cliphist decode | wl-copy

# Navegar entre workspaces com setas
bind = SUPER, right, workspace, r+1
bind = SUPER, left, workspace, r-1

# Mover janela para workspace ao lado
bind = SUPER SHIFT, right, movetoworkspace, r+1
bind = SUPER SHIFT, left, movetoworkspace, r-1

# Trocar janela em foco com a próxima/anterior
bind = SUPER SHIFT, up, swapnext
bind = SUPER SHIFT, down, swapnext, prev

# Screenshots
bind = , Print, exec, ~/.local/bin/screenshot area
bind = SHIFT, Print, exec, ~/.local/bin/screenshot full
bind = SUPER SHIFT, S, exec, ~/.local/bin/screenshot area

# Volume
bindel = , XF86AudioRaiseVolume, exec, ~/.local/bin/osd-volume up
bindel = , XF86AudioLowerVolume, exec, ~/.local/bin/osd-volume down
bindl  = , XF86AudioMute, exec, ~/.local/bin/osd-volume mute

# Brilho
bindel = , XF86MonBrightnessUp, exec, ~/.local/bin/osd-brightness up
bindel = , XF86MonBrightnessDown, exec, ~/.local/bin/osd-brightness down

bind = $mod, H, movefocus, l
bind = $mod, L, movefocus, r
bind = $mod, K, movefocus, u
bind = $mod, J, movefocus, d

bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5

bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5

bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow
