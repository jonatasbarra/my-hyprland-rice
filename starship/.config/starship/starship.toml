format = "\n$directory$git_branch$git_status$git_state$python$rust$golang$nodejs$java$kotlin$c$cmd_duration\n$character"
[╭─](overlay0) $directory$git_branch$git_status$git_state$python$rust$golang$nodejs$java$kotlin$c$cmd_duration
[╰─](overlay0)$character"""

# ── Diretório ──────────────────────────────────────────
[directory]
style = "blue bold"
truncation_length = 3
truncate_to_repo = true   # mostra root do repo quando dentro de um
home_symbol = "~"

# ── Git ────────────────────────────────────────────────
[git_branch]
symbol = " "
style = "purple"
format = "[$symbol$branch]($style) "

[git_status]
style = "red"
format = '([$all_status$ahead_behind]($style) )'
conflicted = "⚡"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
modified = "!${count}"
untracked = "?${count}"
staged = "+${count}"
deleted = "✘${count}"

# ── Linguagens (aparecem só quando detectadas) ─────────
[python]
symbol = " "
style = "yellow"
format = "[$symbol$version]($style) "

[rust]
symbol = " "
style = "red"
format = "[$symbol$version]($style) "

[golang]
symbol = " "
style = "cyan"
format = "[$symbol$version]($style) "

[nodejs]
symbol = " "
style = "green"
format = "[$symbol$version]($style) "

[java]
symbol = " "
style = "red"
format = "[$symbol$version]($style) "

[kotlin]
symbol = " "
style = "purple"
format = "[$symbol$version]($style) "

[c]
symbol = " "
style = "blue"
format = "[$symbol$version]($style) "

# ── Tempo de execução ─────────────────────────────────
# Mostra só para comandos que levam mais de 2s
[cmd_duration]
min_time = 2000
style = "yellow"
format = "[ $duration]($style) "

# ── Caractere do prompt ────────────────────────────────
[character]
success_symbol = "[❯](green)"
error_symbol   = "[❯](red)"    # vermelho se último comando falhou

# ── Paleta Tokyo Night ─────────────────────────────────
[palettes.tokyo_night]
blue     = "#7aa2f7"
purple   = "#bb9af7"
cyan     = "#7dcfff"
green    = "#9ece6a"
yellow   = "#e0af68"
red      = "#f7768e"
overlay0 = "#565f89"
