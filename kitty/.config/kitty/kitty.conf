# ╔══════════════════════════════════════════════════════╗
# ║              kitty.conf — jon-zenbook                ║
# ║         Theme: Tokyo Night | Font: JetBrainsMono     ║
# ╚══════════════════════════════════════════════════════╝

# BEGIN_KITTY_THEME
# Tokyo Night
include current-theme.conf
# END_KITTY_THEME

# ── Fonte ─────────────────────────────────────────────────────────────────
font_family      JetBrainsMono Nerd Font
bold_font        JetBrainsMono Nerd Font Bold
italic_font      JetBrainsMono Nerd Font Italic
bold_italic_font JetBrainsMono Nerd Font Bold Italic
font_size        12.0
disable_ligatures never

# ── Cursor ────────────────────────────────────────────────────────────────
cursor_shape          block
# 0 = sem piscar
cursor_blink_interval 0
# trail sutil: facilita achar o cursor após saltos grandes
cursor_trail          3
cursor_trail_decay    0.1 0.4

# ── Janela ────────────────────────────────────────────────────────────────
# respiro interno em todos os lados
window_padding_width    10
remember_window_size    yes
# sem barra de título — Hyprland gerencia decorações
hide_window_decorations yes

# ── Transparência e blur ───────────────────────────────────────────────────
background_opacity 0.92
background_blur    16

# ── Scrollback ────────────────────────────────────────────────────────────
# default 2000 é pouco para dev
scrollback_lines 10000
touch_scroll_multiplier 3.0
wheel_scroll_multiplier 5.0
touch_scroll_multiplier 10.0
wheel_scroll_multiplier 5.0
touch_scroll_multiplier 7.0
wheel_scroll_multiplier 5.0
touch_scroll_multiplier 5.0
wheel_scroll_multiplier 5.0
touch_scroll_multiplier 3.0
wheel_scroll_multiplier 7.0
touch_scroll_multiplier 3.0
wheel_scroll_multiplier 5.0

# ── Bell ──────────────────────────────────────────────────────────────────
enable_audio_bell no

# ── Tab bar ───────────────────────────────────────────────────────────────
tab_bar_style        powerline
tab_powerline_style  angled
# barra só aparece com 2+ tabs abertas
tab_bar_min_tabs     2
tab_title_template   "{index}: {title}"

# ── Performance ───────────────────────────────────────────────────────────
# ~120fps (default 10 = ~100fps)
repaint_delay   8
# ms de delay de input (default 3)
input_delay     2
sync_to_monitor yes

# ── Shell integration ──────────────────────────────────────────────────────
shell_integration enabled

# ── Keybinds adicionais ────────────────────────────────────────────────────
# nova janela no mesmo diretório
map ctrl+shift+enter launch --cwd=current
# nova aba no mesmo diretório
map ctrl+shift+t new_tab_with_cwd
# zoom de fonte
map ctrl+shift+equal     change_font_size all +1.0
map ctrl+shift+minus     change_font_size all -1.0
map ctrl+shift+backspace change_font_size all 0
# reload config
map ctrl+shift+f5 load_config_file
